[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
methods = { path = "../methods" }
# Two deliberate departures from risc0-zkvm's defaults, both about making the
# prover that runs be the prover we think is running:
#
# * `prove` is NOT a default feature. Without it, `default_prover` and
#   `default_executor` silently shell out to an `r0vm` subprocess over IPC,
#   which added a fixed ~10 ms to every executor call and swamped the
#   executor-only measurement. The Phase 2b daemon will prove in-process.
# * `default-features = false` drops `bonsai`, which IS a default. With it
#   compiled in, `default_prover` returns a *remote* Bonsai prover whenever
#   BONSAI_API_URL and BONSAI_API_KEY are set in the environment — and it
#   checks that branch before the local one. Removing the feature removes the
#   branch; `--bench` additionally refuses to run unless the backend is
#   "local", so neither the compile-time nor the runtime path can go remote
#   without saying so.
#
# `metal` is deliberately absent, and it would not buy anything anyway: in 3.0.6
# it is a pure alias for `prove`, risc0-sys compiles the kernels on any macOS
# target regardless, and both circuit provers have their Metal branches commented
# out and fall through to CPU. Proving here is CPU-only. See prover/README.md.
risc0-zkvm = { version = "^3.0.6", default-features = false, features = ["prove"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = "1.0"
anyhow = "1.0"
# 1.3 is the version risc0 itself serialises receipts with; keeping it aligned
# means the measured receipt size is the one downstream tooling will see.
bincode = "1.3"
# Same crate and version as the guest, so a host/guest digest disagreement is a
# real bug rather than a library difference.
sha2 = "0.10"
# The wire types the guest reads and writes. The host frames input and parses
# journals with the same definitions the guest was compiled against.
policy-core = { path = "../policy-core" }
# Same codec as the guest's frame reader.
postcard = { version = "1", default-features = false, features = ["alloc"] }
base64 = "0.22"
# The `--execute-stdin` protocol, the `/execute` response, and the
# journal-shape tests.
serde_json = "1.0"
# The :4500 daemon. `axum`'s default features are the ones it needs (http1,
# json, the tokio listener); nothing here speaks TLS or makes an outbound
# request, and `cargo tree` is the check that stays true.
axum = "0.8"
# One multi-threaded runtime serves HTTP. Proving does NOT run on it — see
# `queue.rs`: that is one dedicated OS thread, because a composite prove
# saturates every core for minutes and would starve `/execute` otherwise.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tracing = "0.1"
# Job ids: 16 bytes from the OS CSPRNG. Unpredictable rather than merely
# unique, so a caller cannot enumerate another caller's receipts.
rand = "0.9"

[dev-dependencies]
# `tests/guest_io.rs` redirects this process's fd 2 to prove that a guest panic
# no longer prints request bytes to the host's stderr. risc0's default `PosixIo`
# writes there through `std::io::stderr()`, so nothing short of dup2 can observe
# it. Both crates are already in the dependency graph via risc0.
libc = "0.2"
tempfile = "3"
