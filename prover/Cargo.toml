[workspace]
resolver = "2"
# `verify` is deliberately NOT a member: see prover/verify/Cargo.toml. Cargo
# unifies features across a workspace build, and that crate takes `risc0-zkvm`
# with `disable-dev-mode`, which would make `host`'s dev-mode refusal a panic
# inside risc0 rather than the one-line message Task 5 specified.
members = ["host", "methods", "policy-core", "release-manifest"]
exclude = ["verify"]

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
